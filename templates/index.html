<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Predictor</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            color: #333;
            margin-bottom: 20px;
        }

        input{
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button{
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover{
            background: #0056b3;
        }

        .result{
            margin-top: 20px;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Placement Prediction System</h1>

        <form action="/predict_form" method="POST">

            <input type="number" step="0.01" name="CGPA" placeholder="CGPA" required>

            <input type="number" name="Internships" placeholder="Internships" required>

            <input type="number" name="Projects" placeholder="Projects" required>

            <input type="number" name="Workshops" placeholder="Workshops" required>

            <input type="number" name="Certifications" placeholder="Certifications" required>

            <input type="number" name="AptitudeScore" placeholder="Aptitude Score" required>

            <input type="number" name="SoftSkillsRating" placeholder="Soft Skills Rating" required>

            <button type="submit">Predict</button>

        </form>

        <div class="result">
            {{ prediction_text }}
        </div>

    </div>

</body>
</html>
